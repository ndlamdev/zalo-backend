plugins {
    id "org.springframework.boot" version "3.5.4"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.jetbrains.kotlin.jvm" version "1.9.25"
    id "org.jetbrains.kotlin.plugin.spring" version "1.9.25"
    id "com.google.protobuf" version "0.9.5"
    id "org.jetbrains.kotlin.kapt" version "2.2.0"
}

group = "com.lamnguyen"
version = "0.0.1-SNAPSHOT"

ext {
    springGrpcVersion = "3.1.0.RELEASE"
    redissonVersion = "3.50.0"
    grpcVersion = '1.75.0'
    protobufVersion = '4.32.0-RC1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}


repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-websocket"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
    implementation "io.projectreactor.kotlin:reactor-kotlin-extensions"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactor"
    implementation "org.springframework.kafka:spring-kafka"
    implementation "org.springframework.boot:spring-boot-starter-data-redis-reactive"
    implementation "org.redisson:redisson:${redissonVersion}"
    implementation "org.redisson:redisson-spring-data-35:${redissonVersion}"
    // https://mvnrepository.com/artifact/com.esotericsoftware/kryo
    implementation "com.esotericsoftware:kryo:5.6.2"
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "net.devh:grpc-spring-boot-starter:${springGrpcVersion}"
    implementation "net.devh:grpc-client-spring-boot-starter:${springGrpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation platform("io.grpc:grpc-bom:${grpcVersion}")
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-core:${grpcVersion}"
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll("-Xjsr305=strict")
    }
}

tasks.named("test") {
    useJUnitPlatform()
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}