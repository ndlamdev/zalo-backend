syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.lamnguyen.chatws.protos";
option java_outer_classname = "ChatProto";

service ChatService {
  rpc GetRoomChatMember(RoomChatMemberRequest) returns(RoomChatMemberResponse);
}

message RoomChatMemberRequest {
  string room_chat_id = 1;
  repeated string member = 2;
}

message RoomChatMemberResponse{
  repeated string phone_number = 1;
}