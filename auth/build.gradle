plugins {
    id "org.springframework.boot" version "3.5.4"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.jetbrains.kotlin.jvm" version "1.9.25"
    id "org.jetbrains.kotlin.plugin.spring" version "1.9.25"
}

group = 'com.lamnguyen'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    redissonVersion = "3.50.0"
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'io.projectreactor.kotlin:reactor-kotlin-extensions'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-starter-rsocket'
    implementation 'org.springframework.security:spring-security-rsocket'
    implementation 'org.springframework.security:spring-security-messaging'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'io.asyncer:r2dbc-mysql:1.4.2'
    implementation 'org.flywaydb:flyway-mysql:12.6.1'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.9'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.9'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation "org.redisson:redisson:${redissonVersion}"
    implementation "org.redisson:redisson-spring-data-35:${redissonVersion}"
    // https://mvnrepository.com/artifact/com.esotericsoftware/kryo
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.1'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'io.projectreactor.kafka:reactor-kafka:1.3.25'
}

tasks.named('test') {
    useJUnitPlatform()
}