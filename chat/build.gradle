plugins {
    id "org.springframework.boot" version "3.5.4"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.jetbrains.kotlin.jvm" version "1.9.25"
    id "org.jetbrains.kotlin.plugin.spring" version "1.9.25"
    id "org.jetbrains.kotlin.kapt" version "2.2.0"
}

ext {
    grpcVersion = "1.75.0"
    protobufVersion = "4.32.0-RC1"
    mapstructVersion = "1.6.3"
    redissonVersion = "3.50.0"
}

group = "com.lamnguyen"
version = "0.0.1-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
    implementation "io.projectreactor.kotlin:reactor-kotlin-extensions"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactor"
    implementation "org.apache.kafka:kafka-streams"
    implementation "org.flywaydb:flyway-core"
    implementation 'org.flywaydb:flyway-mysql'
    implementation "org.springframework:spring-jdbc"
    implementation "org.springframework.kafka:spring-kafka"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.asyncer:r2dbc-mysql:1.4.2'
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "io.projectreactor:reactor-test"
    testImplementation "org.springframework.kafka:spring-kafka-test"
    testImplementation "org.springframework.security:spring-security-test"
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "com.googlecode.libphonenumber:libphonenumber:9.0.9"
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.9"
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    kapt "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    implementation "org.redisson:redisson:${redissonVersion}"
    implementation "org.redisson:redisson-spring-data-35:${redissonVersion}"
    implementation "com.esotericsoftware:kryo:5.6.2"
    implementation "com.fasterxml.uuid:java-uuid-generator:5.1.1"
    implementation "org.springframework.boot:spring-boot-starter-rsocket"
    implementation "org.springframework.security:spring-security-rsocket"
    implementation "com.fasterxml.uuid:java-uuid-generator:5.2.0"
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll "-Xjsr305=strict"
    }
}

tasks.named("test") {
    useJUnitPlatform()
}